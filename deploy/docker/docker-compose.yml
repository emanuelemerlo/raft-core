# Cluster di 3 nodi + SQL Server condiviso, per sviluppo e prove di failover.
#   docker compose -f deploy/docker/docker-compose.yml up --build
#   curl -X POST localhost:5001/api/v1/data -H "X-Request-ID: $(uuidgen)" -H "Content-Type: application/json" -d '{"a":1}'
#   docker compose -f deploy/docker/docker-compose.yml kill node1     # crash del nodo 1
# Al PRIMO avvio i nodi richiedono Storage:AllowEmptyState=true (impostato qui da RAFT_FIRST_START, default true):
# dopo il primo avvio eseguire con RAFT_FIRST_START=false.
x-node: &node
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: raftcore:dev
  depends_on:
    sqlserver:
      condition: service_healthy
  environment: &env
    CLUSTER_SECRET: ${CLUSTER_SECRET:-change-me-dev-secret-0123456789}
    RAFT_SQL_CONNECTION: "Server=sqlserver,1433;Database=master;User Id=sa;Password=${SA_PASSWORD:-RaftCore!Dev123};TrustServerCertificate=True;Encrypt=False"
    RaftCluster__ClusterId: compose-cluster
    RaftCluster__ClusterSize: "3"
    RaftCluster__Members__0: 11111111-1111-1111-1111-111111111111
    RaftCluster__Members__1: 22222222-2222-2222-2222-222222222222
    RaftCluster__Members__2: 33333333-3333-3333-3333-333333333333
    RaftCluster__Peers__11111111-1111-1111-1111-111111111111: http://node1:5000
    RaftCluster__Peers__22222222-2222-2222-2222-222222222222: http://node2:5000
    RaftCluster__Peers__33333333-3333-3333-3333-333333333333: http://node3:5000
    RaftCluster__UdpMode: Disabled
    RaftCluster__StateMachine__Provider: SqlServer
    RaftCluster__Storage__AllowEmptyState: ${RAFT_FIRST_START:-true}
    RaftCluster__Storage__MinFreeBytes: "104857600"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-RaftCore!Dev123}
    ports: [ "14330:1433" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  node1:
    <<: *node
    environment:
      <<: *env
      RaftCluster__NodeId: 11111111-1111-1111-1111-111111111111
      RaftCluster__AdvertiseUrl: http://node1:5000
    ports: [ "5001:5000" ]
    volumes: [ "node1-data:/data" ]

  node2:
    <<: *node
    environment:
      <<: *env
      RaftCluster__NodeId: 22222222-2222-2222-2222-222222222222
      RaftCluster__AdvertiseUrl: http://node2:5000
    ports: [ "5002:5000" ]
    volumes: [ "node2-data:/data" ]

  node3:
    <<: *node
    environment:
      <<: *env
      RaftCluster__NodeId: 33333333-3333-3333-3333-333333333333
      RaftCluster__AdvertiseUrl: http://node3:5000
    ports: [ "5003:5000" ]
    volumes: [ "node3-data:/data" ]

volumes:
  node1-data:
  node2-data:
  node3-data:
