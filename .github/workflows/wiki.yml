name: Wiki

# Pubblica docs/wiki nella Wiki del repository a ogni modifica su main.
# Prerequisito una tantum: abilitare la Wiki e creare la prima pagina dall'interfaccia di GitHub
# (il repository <repo>.wiki.git esiste solo dopo la prima pagina).
on:
  push:
    branches: [ main ]
    paths: [ 'docs/wiki/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizza docs/wiki con la Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$url" > /dev/null 2>&1; then
            echo "::error title=Wiki non inizializzata::Il repository ${GITHUB_REPOSITORY}.wiki.git non esiste ancora. Aprire https://github.com/${GITHUB_REPOSITORY}/wiki, creare e salvare una prima pagina qualsiasi (es. Home), poi rieseguire questo workflow (Actions > Wiki > Run workflow)."
            exit 1
          fi
          git clone "$url" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git add -A
          git diff --cached --quiet && { echo "Wiki già aggiornata"; exit 0; }
          git commit -m "Aggiornamento da ${GITHUB_SHA::7}"
          if ! git push; then
            echo "::error title=Push sulla Wiki rifiutato::Il token del workflow non può scrivere sulla Wiki. Verificare Settings > Actions > General > Workflow permissions = Read and write."
            exit 1
          fi
