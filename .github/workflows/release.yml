name: Release

# Crea una release quando viene pubblicato un tag vX.Y.Z (es. git tag v0.2.0 && git push origin v0.2.0).
# Le note di rilascio sono la sezione corrispondente di CHANGELOG.md.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da costruire senza pubblicare (es. 0.2.0-test)'
        required: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: 8.0.x }
      - run: dotnet test RaftCore.sln -c Release --filter "Category!=SqlServer"

  build:
    name: Pacchetto ${{ matrix.rid }}
    needs: [ version, test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, archive: zip }
          - { rid: linux-x64,   os: ubuntu-latest,  archive: tar }
          - { rid: linux-arm64, os: ubuntu-latest,  archive: tar }
          - { rid: osx-arm64,   os: macos-latest,   archive: tar }
          - { rid: osx-x64,     os: macos-latest,   archive: tar }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: 8.0.x }
      - name: Publish (self-contained, file singolo)
        shell: bash
        run: |
          dotnet publish src/RaftCore/RaftCore.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ needs.version.outputs.version }} -o out/raftcore
          cp README.md CHANGELOG.md out/raftcore/
          mkdir -p out/raftcore/deploy && cp -r deploy/config deploy/systemd deploy/windows deploy/macos out/raftcore/deploy/
      - name: Archivio
        shell: bash
        run: |
          name=raftcore-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          cd out
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z a -tzip ../$name.zip raftcore > /dev/null; else tar czf ../$name.tar.gz raftcore; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.rid }}
          path: raftcore-*.*

  docker:
    name: Immagine container
    needs: [ version, test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome immagine
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.img.outputs.name }}:latest

  release:
    name: Pubblica la release
    needs: [ version, build, docker ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }
      - name: Note di rilascio da CHANGELOG.md
        run: |
          v=${{ needs.version.outputs.version }}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Sezione [$v] mancante in CHANGELOG.md" >&2; exit 1; fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ needs.version.outputs.version }}
          pre=""; case "$v" in *-*) pre="--prerelease";; esac
          gh release create "v$v" dist/* --title "RaftCore $v" --notes-file notes.md $pre
