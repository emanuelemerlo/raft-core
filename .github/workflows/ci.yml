name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RAFTCORE_TEST_LOGS: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        # Dopo aver generato e committato i packages.lock.json (vedi docs/security-hardening.md),
        # aggiungere --locked-mode per far fallire la build su qualsiasi deriva delle dipendenze:
        #   run: dotnet restore RaftCore.sln --locked-mode
        run: dotnet restore RaftCore.sln
      - name: Build
        run: dotnet build RaftCore.sln -c Release --no-restore
      - name: Test (unit, cluster, E2E)
        run: dotnet test RaftCore.sln -c Release --no-build --filter "Category!=SqlServer" --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --logger GitHubActions
      - name: Annotazioni con i log dei test falliti
        if: failure()
        shell: bash
        run: .github/scripts/annotate-failed-tests.sh
      - name: Log dei nodi (solo in caso di errore)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            test-logs/
            **/TestResults/*.trx
          if-no-files-found: ignore

  sqlserver:
    name: Test di integrazione SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "RaftCore!Test123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'RaftCore!Test123' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      RAFT_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=RaftCore!Test123;TrustServerCertificate=True;Encrypt=False"
      RAFTCORE_TEST_LOGS: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Test SQL Server
        run: dotnet test RaftCore.sln -c Release --filter "Category=SqlServer" --logger "console;verbosity=normal" --logger GitHubActions
      - name: Log dei nodi (solo in caso di errore)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-sqlserver
          path: test-logs/
          if-no-files-found: ignore
